name: terraform-oci-iam

# WHEN does this pipeline run?
#  - On a Pull Request into main  -> checks + plan only (nothing changes in OCI)
#  - On a push/merge into main    -> plan, then apply after you approve
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

# Secrets -> environment variables, available to every step below.
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
  OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
  OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
  OCI_REGION: ${{ secrets.OCI_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}        # for the state bucket
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}    # for the state bucket

defaults:
  run:
    shell: bash
    working-directory: terraform

jobs:
  # ---------------------------------------------------------------- PLAN
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Write OCI login config from secrets
        run: sh ../ci/write-oci-config.sh

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (download OCI provider, connect to state bucket)
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan (what WOULD change)
        run: |
          terraform plan -out=tfplan -no-color | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the plan for the apply job
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 3

  # ---------------------------------------------------------------- APPLY
  apply:
    needs: plan
    # Only on main, never on a Pull Request
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production      # pipeline PAUSES here until a reviewer approves
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Download the approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Write OCI login config from secrets
        run: sh ../ci/write-oci-config.sh

      - name: Init
        run: terraform init

      - name: Apply exactly the approved plan
        run: terraform apply tfplan

      - name: Show what was created
        run: terraform output
